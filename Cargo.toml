[profile.dev]
# Windows MSVC link.exe hits PDB LIMIT (LNK1318) once the dependency
# tree gets big (axum + sqlx + reqwest + jsonwebtoken + tokio-cron-
# scheduler + tracing all carry many monomorphisations). Line-tables-
# only debug info keeps backtraces useful while keeping the PDB inside
# the linker's per-record limit on Windows.
debug = "line-tables-only"

[workspace]
resolver = "2"
members = [
    "crates/kanade-shared",
    "crates/kanade-agent",
    "crates/kanade-backend",
    "crates/kanade",
    "crates/kanade-client",
]

[workspace.package]
version      = "0.45.16"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/kanadehq/kanade"
homepage     = "https://github.com/kanadehq/kanade"
authors      = ["yukimemi <yukimemi@gmail.com>"]
keywords     = ["nats", "jetstream", "endpoint-management", "orchestration"]
categories   = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# Internal workspace members — centralised here so the version bump
# from a release PR touches one place instead of three. Each consumer
# crate uses `kanade-shared.workspace = true` and inherits the path
# + version from this single declaration.
kanade-shared      = { path = "crates/kanade-shared", version = "0.45.16" }

tokio              = { version = "1.53.1", features = ["full"] }
async-nats         = "0.50.0"
dirs               = "6"
kaishin            = "0.6.4"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.151"
toml               = "1.1.4"
teravars           = { version = "0.2.1", features = ["merge"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender   = "0.2.5"
anyhow             = "1.0.104"
thiserror          = "2.0.20"
clap               = { version = "4.6.6", features = ["derive", "env"] }
uuid               = { version = "1.25.0", features = ["v4", "v5", "serde"] }
chrono             = { version = "0.4.45", features = ["serde"] }
futures            = "0.3.34"
# CLI-side expansion of `job/schedule create` glob/dir arguments (#654).
# PowerShell never expands globs before exec, so the CLI does it itself.
glob               = "0.3.4"
bytes              = "1.12.1"
humantime          = "2.4.0"
rand               = "0.10.2"
# Schedule::validate() checks the `when: { cron: ... }` escape hatch
# with the SAME parser tokio-cron-scheduler uses internally, so
# create-time validation can never accept what register() would
# reject. Pinned `=` to the version tokio-cron-scheduler 0.15.1
# already pulls transitively — one copy in the tree, no skew.
croner             = "=3.0.1"
regex              = "1.13.1"
# `ws` powers `GET /api/remote/{pc_id}/ws`, the operator's end of the
# #1140 remote-assistance relay (`api::remote`).
axum               = { version = "0.8.9", features = ["multipart", "ws"] }
sqlx               = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
tower              = "0.5.3"
tower-http         = { version = "0.7.0", features = ["cors", "trace", "compression-gzip", "compression-br"] }
serde_yaml         = "0.9.34"
serde_ignored      = "0.1.14"
schemars           = { version = "1.2.2", features = ["chrono04", "uuid1"] }
reqwest            = { version = "0.13.4", features = ["json"] }
# Compliance-alert + generic outbound email over an internal SMTP relay
# (backend only). rustls TLS to match reqwest and avoid an OpenSSL
# build dependency; `pool` reuses connections across sends.
lettre             = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "pool"] }
# Hidden password prompt for `kanade login` / account creation. Cross-
# platform (Win/macOS/Linux), no cfg gating needed.
rpassword          = "7.5.4"
tokio-cron-scheduler = "0.15.1"
rust-embed         = "8.12.0"
mime_guess         = "2.0.5"
# jsonwebtoken 10.x routes HS256 through a rustls-style CryptoProvider and
# panics at runtime ("Could not automatically determine the process-level
# CryptoProvider") on the first encode/decode unless exactly one provider
# feature is enabled. The default features don't pin one (and other deps
# pull rustls providers, making auto-detection ambiguous), so pin the
# pure-Rust provider explicitly — no C toolchain, clean cross-compile.
jsonwebtoken       = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
# #1192: TOTP MFA. otpauth = build the enrollment URL; gen_secret = random
# secret. no default features → skips the heavy qr image dep (the SPA renders
# the QR from the otpauth URL instead).
totp-rs            = { version = "5.7.2", default-features = false, features = ["gen_secret", "otpauth"] }
# Same CryptoProvider ambiguity as jsonwebtoken above, but for the async-nats
# TLS (wss) path: the CLI links BOTH aws-lc-rs (via reqwest) and ring (via
# async-nats), so rustls can't auto-pick and `kanade run` over wss panics on
# the first flush (#1187). The CLI declares rustls directly only to call
# `crypto::ring::default_provider().install_default()` in main(); ring matches
# the pure-Rust choice above. Version tracks the transitive rustls in the lock.
rustls             = { version = "0.23.43", default-features = false, features = ["ring"] }
# argon2id password hashing for RBAC accounts (backend `users` table).
# Pulls in `password-hash` (PHC string format, SaltString) transitively.
argon2             = "0.5.3"
sha2               = "0.11.0"
# Decoding NATS Object Store digest strings (`SHA-256=<base64>`)
# back into raw bytes so the agent's hex-formatted Command field
# (#210 / #213) compares cleanly with sha2's hex output.
base64             = "0.23.1"
# #1165: backend-signed commands. Already in the tree transitively via
# async-nats/nkeys, so declaring it directly adds no third-party code to
# compile or audit — only the ability to call it.
ed25519-dalek      = { version = "2.2.0", features = ["rand_core"] }
# #1165: 32 random bytes for a signing-key seed. Direct rather than via
# `SigningKey::generate`, which needs a matching `rand_core` major.
getrandom          = "0.4.3"
winreg             = "0.56"
pelite             = "0.10"
# v0.37 Part 2: agent process self-perf via NT process info APIs
# (Win32) / /proc (Linux). v0.40 Part 1: add `disk` + `network`
# features for the host-wide perf loop (Disks / Networks). Still
# avoid `multithread` since we refresh on a 30–60 s cadence.
sysinfo            = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
winres             = "0.1.12"
